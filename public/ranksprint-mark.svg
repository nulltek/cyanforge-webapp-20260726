<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RankSprint mark</title>
  <desc id="desc">A cyan rounded-square speed-path mark with an upward ranking line.</desc>
  <defs>
    <linearGradient id="markGradient" x1="72" y1="64" x2="440" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6EEBFF"/>
      <stop offset="0.48" stop-color="#23BEE8"/>
      <stop offset="1" stop-color="#0C91BD"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="150" y1="312" x2="362" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9FCFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="128%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#1DB7DE" flood-opacity="0.30"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <rect x="56" y="56" width="400" height="400" rx="112" fill="url(#markGradient)"/>
    <path d="M142 317C196 245 242 271 286 216C312 184 340 166 380 156" stroke="url(#lineGradient)" stroke-width="34" stroke-linecap="round"/>
    <path d="M348 144L396 152L368 194" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M164 365H372" stroke="#BDF6FF" stroke-width="28" stroke-linecap="round" opacity="0.72"/>
    <path d="M166 365H220M258 365H312M348 365H374" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
    <circle cx="144" cy="317" r="18" fill="#FFFFFF"/>
    <circle cx="286" cy="216" r="18" fill="#FFFFFF"/>
  </g>
</svg>
